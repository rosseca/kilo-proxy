name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish verified archives and generated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py publish --tag "$RELEASE_TAG"

  homebrew:
    name: Update Homebrew tap
    needs: publish
    # Validated release versions use a hyphen only for alpha/beta/RC tags.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: rosseca/homebrew-tap/.github/workflows/update-kilo-proxy.yml@75b8d5c6733b7acd3da67929cc0d322c0be1cd45
    permissions:
      contents: read
    secrets:
      KILO_PROXY_TAP_DEPLOY_KEY: ${{ secrets.KILO_PROXY_TAP_DEPLOY_KEY }}

  apt:
    name: Update Ubuntu APT repository
    needs: publish
    if: ${{ !contains(github.ref_name, '-') && vars.KILO_APT_ENABLED == 'true' }}
    uses: ./.github/workflows/apt-publish.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      signing-fingerprint: ${{ vars.KILO_APT_FINGERPRINT }}
      allow-bootstrap: ${{ vars.KILO_APT_BOOTSTRAP == 'true' }}
    secrets:
      KILO_APT_SIGNING_KEY: ${{ secrets.KILO_APT_SIGNING_KEY }}
